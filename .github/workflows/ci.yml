name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edushare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edushare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/edushare
      DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/edushare
      APP_URL: http://localhost:3000
      NODE_ENV: test
      LOG_LEVEL: warn
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format
      - name: Unit + integration tests
        run: npm test -- --run
      - name: Migrate up, verify, migrate down, migrate up (G6)
        run: |
          npm run db:migrate
          npm run db:migrate:status
          npm run db:seed
          npm run db:migrate:down
          npm run db:migrate:status
          npm run db:migrate
      - name: Production build
        run: npm run build
